# Production stack for /opt/tradenotes on the shared VPS.
# Separate from the REDACTED stack: own network, own database, own volumes.
# The app only listens on 127.0.0.1:3010; the Caddy in front of ports 80/443 proxies tradenot.es to it.
name: tradenotes

services:
  app:
    build: .
    image: tradenotes-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://tradenotes:${POSTGRES_PASSWORD}@db:5432/tradenotes
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      - uploads:/data/uploads

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradenotes
      POSTGRES_DB: tradenotes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradenotes -d tradenotes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db:
  uploads:
