# Self-hosting TradeNot.es with Docker Compose: one container, all data in ./data
# (database, screenshots, daily database dumps). Full guide: docs/self-hosting.md
#   docker compose up -d     then open http://<server>:3000 and create the admin account
services:
  tradenotes:
    image: ghcr.io/tradenot-es/tradenotes:latest
    container_name: tradenotes
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      # the address you open TradeNot.es under (links in mails and shared trades, login cookies)
      BASE_URL: http://localhost:3000
      # further addresses, comma-separated, e.g. the IP next to a domain
      # TRUSTED_ORIGINS: http://192.168.1.10:3000
      # owner of ./data (Unraid: 99 / 100)
      # PUID: 1000
      # PGID: 1000
      # more accounts after the first (admin) one
      # ALLOW_SIGNUP: "true"
      # optional mail server for confirmation and password-reset mails
      # SMTP_HOST: smtp.example.com
      # SMTP_PORT: 465
      # SMTP_USER: you@example.com
      # SMTP_PASS: secret
      # an existing Postgres instead of the built-in one
      # DATABASE_URL: postgres://user:password@host:5432/tradenotes
