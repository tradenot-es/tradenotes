# Production stack of tradenot.es in /opt/tradenotes (self-hosting: compose.yaml).
# The server's .env sets COMPOSE_FILE=compose.hosted.yaml, so plain "docker compose" uses this file.
# Own network, own database, own volumes.
# The Caddy in front of ports 80/443 (in a container) reaches the app through the
# external Docker network "edge" as tradenotes-app:3000. The database stays on the default network only.
# 127.0.0.1:3010 is kept for the health check in deploy/deploy.sh.
name: tradenotes

services:
  app:
    build: .
    image: tradenotes-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # the image defaults to self-hosted mode; this is the official instance
      SELF_HOSTED: "false"
      DATABASE_URL: postgres://tradenotes:${POSTGRES_PASSWORD}@db:5432/tradenotes
    ports:
      - "127.0.0.1:3010:3000"
    networks:
      default:
      edge:
        aliases: [tradenotes-app]
    volumes:
      - uploads:/data/uploads

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradenotes
      POSTGRES_DB: tradenotes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradenotes -d tradenotes"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  edge:
    external: true

volumes:
  db:
  uploads:
